# main への push でサイトをビルドし、GitHub Pages へ直接デプロイする。
# （以前は publish ブランチへ push し、そのブランチを Pages の公開元にしていたが、
#  ブランチ更新後に Pages 側の再デプロイが自動で追従しないことがあったため、
#  Actions から直接デプロイする公式の方式に切り替えた）
#
# 前提: リポジトリの Settings > Pages > Build and deployment > Source を
# 「GitHub Actions」に変更しておくこと（ブランチ指定は不要になる）。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続して push されたときは、最新のビルドだけを配置する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-latest は 2026-10-19 から Ubuntu 26 への移行が始まり、
    # 完了まで ubuntu-24.04 / 26.04 のどちらに解決されるか不定になるため、
    # 移行完了まで明示的に 24.04 へ固定する
    runs-on: ubuntu-24.04
    services:
      # 図表（plantuml / graphviz）のレンダリングに使う Kroki
      kroki:
        image: yuzutech/kroki
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          KROKI_SERVER: http://localhost:8000

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
