# main への push でサイトをビルドし、publish ブランチへ配置する。
# GitHub Pages は publish ブランチのルートを公開元にしている。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 連続して push されたときは、最新のビルドだけを配置する
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    # ubuntu-latest は 2026-10-19 から Ubuntu 26 への移行が始まり、
    # 完了まで ubuntu-24.04 / 26.04 のどちらに解決されるか不定になるため、
    # 移行完了まで明示的に 24.04 へ固定する
    runs-on: ubuntu-24.04
    services:
      # 図表（plantuml / graphviz）のレンダリングに使う Kroki
      kroki:
        image: yuzutech/kroki
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          KROKI_SERVER: http://localhost:8000

      # dist/ の中身だけを publish ブランチに置く（.nojekyll も自動で追加される）
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: publish
          publish_dir: ./dist
          commit_message: "サイトを更新"
